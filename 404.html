<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReservaTuEspacio</title>
    <link rel="icon" type="image/png" href="/favicon-rte.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; }
        #loader {
            font-family: Arial, sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; background: #f8fafc;
        }
        .loader-inner { text-align: center; color: #2C3E50; }
        .loader-inner svg { width: 48px; height: 48px; margin-bottom: 16px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-inner p { font-size: 14px; color: #888; margin: 0; }
        iframe {
            display: none;
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }
    </style>
</head>
<body>
<div id="loader">
    <div class="loader-inner">
        <svg viewBox="0 0 24 24" fill="none" stroke="#71D997" stroke-width="2">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
        </svg>
        <p>Cargando...</p>
    </div>
</div>
<iframe id="app" scrolling="yes"></iframe>

<script>
(function() {
    const path = window.location.pathname;
    const parts = path.replace(/^\//, '').split('/');
    const search = window.location.search;
    const params = new URLSearchParams(search);

    const rutasReservadas = ['landing', 'reservas', 'soporte', 'faq-usuarios', 'faq-tenants',
                             'superadmin', 'pago-exitoso', 'padel', 'futbol5', 'academias',
                             'consultorios', 'coworking', 'sitemap.xml', '404',
                             'robots.txt', 'favicon-rte.png', 'Padel-02.png',
                             'pexels-zeynep-beste-990301136-20657537.jpg',
                             'pexels-felipebalduino-9578526.jpg'];

    function cargarEnIframe(src) {
        const iframe = document.getElementById('app');
        iframe.src = src;
        iframe.onload = function() {
            document.getElementById('loader').style.display = 'none';
            iframe.style.display = 'block';
        };
    }

    // /admin/slug — pasar slug por hash al iframe
    if (parts[0] === 'admin' && parts[1]) {
        cargarEnIframe('/admin.html#tenant=' + parts[1]);
        return;
    }

    // /slug — pasar slug por hash al iframe
    if (parts[0] && !rutasReservadas.includes(parts[0])) {
        const pago = params.get('pago');
        const reservaId = params.get('reserva_id');
        let src = '/reservas.html#tenant=' + parts[0];
        if (pago) src += '&pago=' + pago + (reservaId ? '&reserva_id=' + reservaId : '');
        cargarEnIframe(src);
        return;
    }

    window.location.replace('/');
})();
</script>
</body>
</html>
